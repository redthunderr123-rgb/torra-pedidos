<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Torra Pedidos">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icone.png">
<title>Torra Pedidos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Poppins:wght@600;700&display=swap">
<style>
:root{--bg:#ffffff;--fg:#2b2523;--muted:#7a6f6a;--wine:#6b1d1d;--line:#e6ddd6;--soft:#fbf8f6;--ok:#2f6b3a;--ok-bg:#e6f0e5;
  --body:"Inter",system-ui,sans-serif;--disp:"Poppins","Inter",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) max(20px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(20px,env(safe-area-inset-left,0px))}
[hidden]{display:none!important}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:clamp(12px,2.5vh,26px);border-bottom:2px solid var(--wine)}
.logo{height:clamp(36px,6vh,64px)}
.tit{font-family:var(--disp);font-weight:700;color:var(--wine);font-size:clamp(20px,3.4vw,44px);letter-spacing:.02em;text-transform:uppercase}
.hora{font-variant-numeric:tabular-nums;font-weight:600;color:var(--muted);font-size:clamp(14px,2vw,26px)}
main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(16px,3vw,40px);padding-block:clamp(14px,3vh,30px);min-height:0}
@media (max-width:640px) and (orientation:portrait){main{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;min-height:0;border-radius:24px;padding:clamp(14px,2vw,26px)}
.col.prep{border:2px solid var(--wine)}
.col.pronto{background:var(--wine);color:#fff}
.col h2{margin:0 0 clamp(10px,2vh,20px);font-family:var(--disp);font-weight:700;font-size:clamp(20px,3vw,40px);text-transform:uppercase;letter-spacing:.02em;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.col.prep h2{color:var(--wine)}
.col h2 small{font-size:.5em;font-weight:600;opacity:.8;text-transform:none;letter-spacing:0}
ol{list-style:none;margin:0;padding:0;display:grid;gap:clamp(8px,1.4vh,14px);overflow:hidden;align-content:start}
.prep li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:clamp(10px,1.5vw,20px);background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:clamp(8px,1.4vh,14px) clamp(12px,1.6vw,20px)}
.num{font-family:var(--disp);font-weight:700;font-variant-numeric:tabular-nums;font-size:clamp(26px,4vw,52px);line-height:1;color:var(--wine);min-width:2.2ch}
.nome{font-weight:700;font-size:clamp(17px,2.3vw,32px);line-height:1.15;overflow-wrap:anywhere}
.falta{font-weight:600;font-size:clamp(13px,1.6vw,20px);color:var(--muted);white-space:nowrap}
.falta.vez{color:var(--wine)}
.pronto li{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:clamp(10px,1.5vw,20px);background:rgba(255,255,255,.1);border-radius:16px;padding:clamp(8px,1.4vh,14px) clamp(12px,1.6vw,20px)}
.pronto .num{color:#fff}
.pronto li.novo{animation:pisca 1s ease-in-out 4}
@keyframes pisca{0%,100%{background:rgba(255,255,255,.1)}50%{background:rgba(255,255,255,.35)}}
@media (prefers-reduced-motion:reduce){.pronto li.novo{animation:none;background:rgba(255,255,255,.3)}}
.vazio{opacity:.7;font-size:clamp(15px,1.8vw,22px);padding:8px 2px}
.mais{font-weight:600;font-size:clamp(13px,1.6vw,20px);opacity:.8;padding:4px 2px}
footer{text-align:center;color:var(--muted);font-size:clamp(12px,1.4vw,18px);padding-bottom:clamp(10px,2vh,20px)}
</style>
</head>

  <div class="tit">Acompanhe seu pedido</div>
  <div class="hora" id="hora"></div>
</header>
<main>
  <section class="col prep"><h2>Preparando <small id="n-prep"></small></h2><ol id="prep"></ol></section>
  <section class="col pronto"><h2>Pronto, pode retirar</h2><ol id="pronto"></ol></section>
</main>
<footer id="rodape">Procure seu número e nome na tela.</footer>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const primeiro=n=>String(n||"").trim().split(/\s+/)[0]||"";
let pedidos=[],vistos=null;
function relogio(){$("hora").textContent=new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});}
relogio();setInterval(relogio,15000);
function caber(ol,itens,fn){
  ol.innerHTML="";
  const disp=ol.parentElement.getBoundingClientRect().bottom-ol.getBoundingClientRect().top-parseFloat(getComputedStyle(ol.parentElement).paddingBottom);
  let i=0;
  for(;i<itens.length;i++){ol.insertAdjacentHTML("beforeend",fn(itens[i],i));if(ol.scrollHeight>disp&&i>0){ol.lastElementChild.remove();break;}}
  if(i<itens.length){ol.insertAdjacentHTML("beforeend",`<li class="mais" style="background:none;border:0">e mais ${itens.length-i}</li>`);
    while(ol.scrollHeight>disp&&ol.children.length>2){ol.children[ol.children.length-2].remove();i--;ol.lastElementChild.textContent="e mais "+(itens.length-i);}}
}
function render(){
  const todos=pedidos.slice().sort((a,b)=>(+a.ts||Date.now())-(+b.ts||Date.now())||(a.id<b.id?-1:1)).map((p,i)=>({...p,n:i+1}));
  const prep=todos.filter(p=>p.status==="fila");
  const pronto=todos.filter(p=>p.status==="pronto").sort((a,b)=>(b.prontoEm||0)-(a.prontoEm||0)||b.n-a.n);
  const atual=new Set(pronto.map(p=>p.id));
  const novos=vistos?new Set([...atual].filter(id=>!vistos.has(id))):new Set();
  vistos=atual;
  $("n-prep").textContent=prep.length?prep.length+(prep.length>1?" pedidos":" pedido"):"";
  if(!prep.length)$("prep").innerHTML='<li class="vazio" style="background:none;border:0">Nenhum pedido em preparo.</li>';
  else caber($("prep"),prep,(p,i)=>`<li><span class="num">${p.n}</span><span class="nome">${esc(String(p.nome||"").trim())}</span><span class="falta${i?"":" vez"}">${i?(i===1?"falta 1 antes":"faltam "+i+" antes"):"é o próximo"}</span></li>`);
  if(!pronto.length)$("pronto").innerHTML='<li class="vazio" style="background:none">Os pedidos prontos aparecem aqui.</li>';
  else caber($("pronto"),pronto,p=>`<li class="${novos.has(p.id)?"novo":""}"><span class="num">${p.n}</span><span class="nome">${esc(String(p.nome||"").trim())}</span></li>`);
}
window.addEventListener("resize",render);
(function(){
  if(!window.FIREBASE_CONFIG||!window.firebase){$("rodape").textContent="Sem conexão com a fila.";render();return;}
  firebase.initializeApp(window.FIREBASE_CONFIG);
  const db=firebase.database();
  db.ref(".info/connected").on("value",s=>{$("rodape").textContent=s.val()?"Procure seu número e nome na tela.":"Reconectando…";});
  db.ref("pedidos").on("value",snap=>{const v=snap.val()||{};pedidos=Object.keys(v).map(id=>({id,...v[id]}));render();});
})();
</script>
</body>
</html>
