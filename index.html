<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Torra">
<meta name="theme-color" content="#f1ede8">
<link rel="apple-touch-icon" href="icone.png">
<link rel="manifest" href="manifest-cliente.json">
<title>Torra</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&family=Jost:wght@400&display=swap">
<style>
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: cardápio à esquerda e fila de pedidos à direita no tablet; empilhado no celular. Visual fixo da marca. */
:root{
  --bg:#f1ede8; --fg:#2b2523; --muted:#6f6560; --wine:#6b1d1d; --wine-dark:#4e1414;
  --line:#ddd4cc; --card:#f8f5f1; --ok:#2f6b3a; --ok-bg:#e3eee2; --warn-bg:#f6e7d6;
  --body:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif; --logo:"Jost","Futura",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;margin:0}
header{border-bottom:1.5px solid var(--wine);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{height:40px;width:auto;display:block}
.hd-dir{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.sync{font-size:11px;font-weight:600;color:var(--muted)}
.sync::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:#b9a99c;vertical-align:0}
.sync.on::before{background:var(--ok)}
.stat{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--wine)}
main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1280px;margin:0 auto}
@media (max-width:820px){main{grid-template-columns:minmax(0,1fr)}}
h2{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--wine);font-weight:700;margin:0 0 12px}
section+section{margin-top:22px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pill{appearance:none;border:2px solid var(--wine);background:var(--wine);color:#fff;border-radius:999px;padding:14px 16px;font:700 13px/1.25 var(--body);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;min-height:56px;text-align:center;transition:background .12s,transform .08s}
.pill:active{transform:scale(.98)}
.pill:focus-visible,.btn:focus-visible,input:focus-visible{outline:3px solid #c98b5a;outline-offset:2px}
.pill.sel{background:var(--wine-dark);box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--wine)}
.pill.opt{background:transparent;color:var(--wine);width:100%}
.pill.opt.sel{background:var(--wine);color:#fff;box-shadow:none}
.nude-m{display:none}
@media (max-width:820px){
  body{font-size:17px}
  header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
  .logo{height:34px}
  .stat{font-size:14px}
  .grid{grid-template-columns:minmax(0,1fr);gap:12px}
  .pill{font-size:17px;min-height:72px;padding:18px 20px}
  h2{font-size:15px}
  .sec-nude{display:none}
  .nude-m{display:block}
  .form{scroll-margin-top:80px}
  input#nome{height:64px;font-size:19px}
  .btn{height:64px;font-size:16px}
  .qty button{height:60px;width:54px}
  .resumo{font-size:17px}
  .nome{font-size:19px}.item{font-size:16px}
  .btn.sm{height:46px;font-size:13px}
}
.form{margin-top:22px;border-top:1px solid var(--line);padding-top:18px;display:grid;gap:12px}
.resumo{font-size:14px;color:var(--muted);min-height:20px}
.resumo b{color:var(--fg)}
.row{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.qty{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:999px;background:var(--card)}
.qty button{appearance:none;border:0;background:none;font:600 22px var(--body);color:var(--wine);width:46px;height:52px;cursor:pointer}
.qty span{min-width:26px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
input#nome{flex:1 1 180px;min-width:0;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:0 20px;height:56px;font:500 17px var(--body);color:var(--fg)}
.btn{appearance:none;border:2px solid var(--wine);background:var(--wine);color:#fff;border-radius:999px;font:700 14px var(--body);letter-spacing:.12em;text-transform:uppercase;cursor:pointer;padding:0 20px;height:56px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--wine)}
.btn.sm{height:40px;font-size:11px;padding:0 14px}
.erro{color:var(--wine);font-size:13px;font-weight:600;min-height:16px}
.aviso{background:var(--wine);color:#fff;border-radius:18px;padding:16px 18px;display:grid;gap:4px}
.aviso .a1{font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;opacity:.85}
.aviso .a2{font-size:22px;font-weight:700;line-height:1.2}
.aviso .a3{font-size:14px;opacity:.9}
.tempo{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:12px}
.tempo .qty button{height:40px;width:40px;font-size:18px}
.tempo .qty span{min-width:46px;font-size:14px}
.espera{display:inline-block;font-size:12px;font-weight:700;color:var(--wine);background:var(--warn-bg);border-radius:999px;padding:3px 10px;margin-top:4px}
.fila-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.fila-head h2{margin:0}
.tabs{display:flex;gap:6px}
.tab{appearance:none;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font:600 12px var(--body);color:var(--muted);cursor:pointer}
.tab.on{border-color:var(--wine);color:var(--wine);background:var(--card)}
ol{list-style:none;margin:0;padding:0;display:grid;gap:10px}
li.ped{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--wine);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px}
li.ped.pronto{border-left-color:var(--ok)}
li.ped.entregue{opacity:.6;border-left-color:var(--line)}
.num{font-size:22px;font-weight:700;color:var(--wine);font-variant-numeric:tabular-nums;grid-row:span 2;align-self:center;min-width:36px}
.top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;min-width:0}
.nome{font-weight:700;font-size:17px;overflow-wrap:anywhere}
.hora{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.item{font-size:14px;overflow-wrap:anywhere}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;border-radius:999px;padding:3px 8px;margin-left:6px;vertical-align:1px}
.tag.nude{background:var(--warn-bg);color:var(--wine)}
.tag.st{background:var(--ok-bg);color:var(--ok)}
.acoes{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
.vazio{border:1.5px dashed var(--line);border-radius:14px;padding:26px 16px;text-align:center;color:var(--muted);font-size:14px}
.confirma{background:var(--warn-bg);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:12px;font-size:14px}
.rodape{margin-top:14px;display:flex;justify-content:flex-end}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
[hidden]{display:none!important}
/* Modo totem (#totem): tela do cliente no tablet, sem a fila */
.totem .fila-col,.totem #aviso,.totem #stat{display:none!important}
.totem main{grid-template-columns:minmax(0,1fr);max-width:1100px}
.totem header{padding-block:18px}
.totem .logo{height:46px}
.totem .cards section{margin-top:0!important}
.totem .cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}
.totem .grid{grid-template-columns:minmax(0,1fr);gap:12px}
.totem .pill{min-height:clamp(60px,7.5vh,92px);font-size:clamp(15px,1.7vw,21px)}
.totem h2{font-size:clamp(13px,1.3vw,17px)}
.totem .sec-nude{display:none}
.totem .nude-m{display:block}
.totem .form{max-width:720px;width:100%;margin:26px auto 0}
.totem input#nome{height:68px;font-size:20px}
.totem .btn{height:68px;font-size:17px}
.totem .sync{font-size:0}
.totem #add{font-size:0}
.totem #add::after{content:"Confirmar pedido";font-size:clamp(15px,1.6vw,19px);letter-spacing:.12em}
@media (max-width:640px){.totem .cards{grid-template-columns:minmax(0,1fr)}}
}
.tela-cheia{display:none;appearance:none;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font:600 11px var(--body);color:var(--muted);cursor:pointer}
.tela-cheia{display:none!important}
/* Visual do cardápio impresso */
.totem{--bg:#ffffff;--card:#fbf8f6}
.totem header{border-bottom:0;justify-content:center;position:relative;padding-block:clamp(14px,2.5vh,28px) 0}
.totem .hd-dir{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:14px}
.hero{display:none}
.totem .hero{display:block;text-align:center;font-family:"Poppins",var(--body);font-weight:700;color:var(--wine);font-size:clamp(54px,10vw,120px);line-height:1;letter-spacing:.01em;margin:clamp(4px,1vh,12px) 0 0}
.totem .cards{margin-top:clamp(112px,16vw,176px);column-gap:clamp(18px,3vw,36px);row-gap:clamp(110px,15vw,160px)}
.totem .cards section{position:relative;border:1.5px solid var(--wine);border-radius:14px;padding:clamp(14px,2vw,22px)}
.totem .cards h2{font-family:"Poppins",var(--body);font-weight:700;font-size:clamp(18px,2.4vw,28px);letter-spacing:0;color:var(--wine);margin-bottom:clamp(10px,1.5vw,16px)}
.fig{display:none}
.totem .fig{display:block;position:absolute;bottom:calc(100% - 1px);height:clamp(110px,16vw,175px);width:auto;pointer-events:none}
.totem .fig.h{left:16%}
.totem .fig.m{right:12%}
.modal{position:fixed;inset:0;background:rgba(43,37,35,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:24px}
.modal-box{background:var(--bg);border-radius:28px;padding:40px 36px;text-align:center;max-width:460px;width:100%;display:grid;gap:10px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-box .ok{width:72px;height:72px;border-radius:50%;background:var(--wine);color:#fff;font-size:40px;line-height:72px;margin:0 auto 6px}
.modal-box h3{margin:0;font-size:30px;color:var(--wine)}
.modal-box p{margin:0;font-size:17px;color:var(--muted)}
</style>
</head>

const KEY="torra-pedidos-site";
const $=id=>document.getElementById(id);
/* pedidos: {id, ts, nome, item, qtd, nude, hora, status: fila|pronto|entregue|excluido} */
let pedidos=[];
try{const s=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(s))pedidos=s;}catch(e){}
const salvarLocal=()=>{try{localStorage.setItem(KEY,JSON.stringify(pedidos));}catch(e){}};
let fb=null; /* Firebase Realtime Database quando configurado */
let sel=null,nude=false,qtd=1,filtro="ativos",confirmando=null;
let seg=40;
try{const v=+localStorage.getItem(KEY+"-seg");if(v>=5)seg=v;}catch(e){}
function fmt(t){if(t<60)return t+" s";const m=Math.floor(t/60),r=t%60;return m+" min"+(r?" "+r+" s":"");}
function setSeg(v){seg=Math.max(5,Math.min(600,v));try{localStorage.setItem(KEY+"-seg",seg);}catch(e){}
  if(fb)fb.ref("config/seg").set(seg).catch(erroSync);render();}
let avisoId=null;

function sync(txt,ok){const s=$("sync");s.textContent=txt;s.className="sync "+(ok?"on":"off");}

(function(){
  if(!window.FIREBASE_CONFIG||!window.firebase){sync("Só neste aparelho",false);return;}
  try{firebase.initializeApp(window.FIREBASE_CONFIG);fb=firebase.database();}catch(e){sync("Só neste aparelho",false);return;}
  sync("Conectando…",false);
  fb.ref(".info/connected").on("value",s=>sync(s.val()?"Sincronizado":"Sem internet, guardando…",!!s.val()));
  if(MODO==="cliente")return; /* a tela do cliente nunca carrega a fila */
  fb.ref("config/seg").on("value",s=>{const v=+s.val();if(v>=5&&v!==seg){seg=v;render();}});
  fb.ref("pedidos").on("value",snap=>{
    const v=snap.val()||{};
    pedidos=Object.keys(v).map(id=>({id,...v[id]}));
    render();
  },()=>sync("Erro de sincronização",false));
})();

function gravar(id,dados){
  if(fb){
    if(dados.ts===undefined)dados.ts=firebase.database.ServerValue.TIMESTAMP;
    fb.ref("pedidos/"+id).set(dados).catch(erroSync);
  }else{
    if(dados.ts===undefined)dados.ts=Date.now();
    const i=pedidos.findIndex(p=>p.id===id);
    if(i>=0)pedidos[i]={id,...dados};else pedidos.push({id,...dados});
    salvarLocal();render();
  }
}
function apagarTudo(){
  if(fb)fb.ref("pedidos").remove().catch(erroSync);
  else{pedidos=[];salvarLocal();render();}
}
function erroSync(e){
  const msg=e&&String(e.code||e.message||"").toLowerCase().includes("permission")?"O banco de dados recusou a gravação. Confira as regras do Firebase.":"Não foi possível salvar. Confira a internet e tente de novo.";
  $("erro").textContent=msg;sync("Erro de sincronização",false);
}

function montar(lista,alvo){
  lista.forEach(nomeItem=>{
    const b=document.createElement("button");
    b.type="button";b.className="pill";b.textContent=nomeItem;
    b.onclick=()=>{sel=nomeItem;avisoId=null;$("aviso").hidden=true;document.querySelectorAll(".grid .pill").forEach(x=>x.classList.toggle("sel",x===b));atualizar();if(celular()){$("form").scrollIntoView({behavior:"smooth",block:"start"});setTimeout(()=>$("nome").focus({preventScroll:true}),350);}else $("nome").focus();};
    $(alvo).appendChild(b);
  });
}
montar(QUENTES,"quentes");montar(GELADOS,"gelados");

const pintaNude=()=>document.querySelectorAll(".nude-btn").forEach(b=>{b.classList.toggle("sel",nude);b.setAttribute("aria-pressed",nude);});
document.querySelectorAll(".nude-btn").forEach(b=>b.onclick=()=>{nude=!nude;pintaNude();atualizar();});
const celular=()=>window.matchMedia("(max-width:820px)").matches;
$("menos").onclick=()=>{qtd=Math.max(1,qtd-1);atualizar();};
$("mais").onclick=()=>{qtd=Math.min(20,qtd+1);atualizar();};
$("nome").oninput=atualizar;

function atualizar(){
  $("qtd").textContent=qtd;
  $("resumo").innerHTML=sel?`<b>${qtd}× ${esc(sel)}</b>${nude?" com Leite Nude":""}`:"Toque em um café para começar.";
  $("add").disabled=!sel||!$("nome").value.trim();
  $("erro").textContent="";
}

$("form").onsubmit=e=>{
  e.preventDefault();
  const nome=$("nome").value.trim();
  if(!sel){$("erro").textContent="Escolha um café.";return;}
  if(!nome){$("erro").textContent="Digite o nome do cliente.";return;}
  const id=fb?fb.ref("pedidos").push().key:Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  avisoId=id;
  gravar(id,{nome,item:sel,qtd,nude,hora:new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}),status:"fila"});
  sel=null;nude=false;qtd=1;$("nome").value="";
  document.querySelectorAll(".pill.sel").forEach(x=>x.classList.remove("sel"));
  pintaNude();if(celular())window.scrollTo({top:0,behavior:"smooth"});
  filtro="ativos";atualizar();render();
  if(totem()){avisoId=null;$("modal-txt").textContent="Obrigado, "+nome+". Já estamos preparando.";$("modal").hidden=false;clearTimeout(window._mt);window._mt=setTimeout(()=>{$("modal").hidden=true;window.scrollTo({top:0});},3500);}
};

$("t-menos").onclick=()=>setSeg(seg-5);
$("t-mais").onclick=()=>setSeg(seg+5);
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{filtro=t.dataset.f;confirmando=null;render();});

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function mudar(id,status){const p=pedidos.find(x=>x.id===id);if(p){const {id:_,n:__,...d}=p;gravar(id,{...d,status});}}

function render(){
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.f===filtro));
  const todos=pedidos.slice().sort((a,b)=>(+a.ts||Date.now())-(+b.ts||Date.now())||(a.id<b.id?-1:1)).map((p,i)=>({...p,n:i+1}));
  const vivos=todos.filter(p=>p.status!=="excluido");
  const ativos=vivos.filter(p=>p.status!=="entregue");
  const espera={};vivos.filter(p=>p.status==="fila").forEach((p,i)=>espera[p.id]=i);
  $("t-seg").textContent=seg+" s";
  const av=$("aviso"),pa=avisoId&&vivos.find(p=>p.id===avisoId);
  if(pa&&pa.status==="fila"){const f=espera[pa.id];
    av.innerHTML=`<div class="a1">Pedido #${pa.n} · ${esc(pa.nome)}</div><div class="a2">${f?"Pronto em aproximadamente "+fmt(f*seg):"É o próximo a sair"}</div><div class="a3">${f?f+(f>1?" pedidos":" pedido")+" na frente":"Nenhum pedido na frente"}</div>`;av.hidden=false;}
  else av.hidden=true;
  const entregues=vivos.filter(p=>p.status==="entregue");
  $("stat").textContent=`${ativos.length} na fila`;
  $("t-ativos").textContent=`Na fila (${ativos.length})`;
  $("t-entregues").textContent=`Entregues (${entregues.length})`;
  const lista=filtro==="ativos"?ativos:entregues.slice().reverse();
  const ol=$("lista");ol.innerHTML="";
  if(!lista.length){
    ol.innerHTML=`<li class="vazio">${filtro==="ativos"?"Nenhum pedido na fila. Escolha o café, digite o nome e toque em Adicionar pedido.":"Nenhum pedido entregue ainda."}</li>`;
  }
  lista.forEach(p=>{
    const li=document.createElement("li");
    li.className="ped "+(p.status==="pronto"?"pronto":p.status==="entregue"?"entregue":"");
    li.innerHTML=`<div class="num">#${p.n}</div>
      <div class="top"><span class="nome">${esc(p.nome)}</span><span class="hora">${esc(p.hora)}</span></div>
      <div class="item">${p.qtd>1?p.qtd+"× ":""}${esc(p.item)}${p.nude?'<span class="tag nude">Leite Nude</span>':""}${p.status==="pronto"?'<span class="tag st">Pronto</span>':""}${p.status==="fila"?`<div><span class="espera">${espera[p.id]?"~"+fmt(espera[p.id]*seg)+" · "+espera[p.id]+" na frente":"Próximo"}</span></div>`:""}</div>
      <div class="acoes"></div>`;
    const a=li.querySelector(".acoes");
    const bt=(txt,cls,fn)=>{const b=document.createElement("button");b.type="button";b.className="btn sm "+cls;b.textContent=txt;b.onclick=fn;a.appendChild(b);};
    if(p.status==="fila"){bt("Excluir","ghost",()=>{confirmando=p.id;render();});bt("Pronto","",()=>mudar(p.id,"pronto"));}
    else if(p.status==="pronto"){bt("Voltar","ghost",()=>mudar(p.id,"fila"));bt("Entregue","",()=>mudar(p.id,"entregue"));}
    else{bt("Devolver à fila","ghost",()=>mudar(p.id,"fila"));}
    if(confirmando===p.id){
      a.innerHTML="";
      const c=document.createElement("div");c.className="confirma";c.style.width="100%";
      c.innerHTML=`<span>Excluir o pedido #${p.n}?</span>`;
      const w=document.createElement("div");w.style.display="flex";w.style.gap="8px";
      const no=document.createElement("button");no.type="button";no.className="btn sm ghost";no.textContent="Cancelar";no.onclick=()=>{confirmando=null;render();};
      const yes=document.createElement("button");yes.type="button";yes.className="btn sm";yes.textContent="Excluir";yes.onclick=()=>{confirmando=null;mudar(p.id,"excluido");};
      w.append(no,yes);c.appendChild(w);a.appendChild(c);
    }
    ol.appendChild(li);
  });
  const z=$("zona");z.innerHTML="";
  if(pedidos.length){
    if(confirmando==="tudo"){
      z.innerHTML=`<div class="confirma"><span>Apagar todos os pedidos dos dois aparelhos e zerar a numeração?</span><div style="display:flex;gap:8px"><button type="button" class="btn sm ghost" id="c-no">Cancelar</button><button type="button" class="btn sm" id="c-yes">Apagar tudo</button></div></div>`;
      $("c-no").onclick=()=>{confirmando=null;render();};
      $("c-yes").onclick=()=>{confirmando=null;apagarTudo();};
    }else{
      z.innerHTML=`<div class="rodape"><button type="button" class="btn sm ghost" id="zerar">Encerrar evento e zerar</button></div>`;
      $("zerar").onclick=()=>{confirmando="tudo";render();};
    }
  }
}
const totem=()=>MODO==="cliente";
document.body.classList.toggle("totem",totem());
$("modal").onclick=()=>{$("modal").hidden=true;};
$("cheia").onclick=()=>{const d=document.documentElement;if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});else if(d.requestFullscreen)d.requestFullscreen().catch(()=>{$("cheia").hidden=true;});else $("cheia").hidden=true;};
atualizar();render();
</script>

</body>
</html>
